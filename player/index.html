<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>MUSIC PLAYER</title>

    <style>
      .range {
        /* -webkit-appearance: none; reset */

        /* optional */
      }

      .range::-webkit-slider-thumb {
        -webkit-appearance: none; /* reset thumb */
        appearance: none;
        width: 10px; /* size */
        height: 10px;
        border-radius: 50%;
        background: rgb(103, 114, 119);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div
      class="border-2 p-3 mx-auto my-32 max-w-screen-xl flex flex-col gap-y-5"
    >
      <div class="bg-red-300">
        <video id="video" width="320" height="240" class="w-full" controls>
          <source src="/video.mp4" type="video/mp4" />
        </video>
      </div>

      <div class="flex gap-x-10 items-center">
        <div>
          <div class="border-slate-600 rounded-full p-2 border-2">
            <i
              class="rotate-180 size-5 fill-slate-700 stroke-none"
              data-lucide="pause"
            ></i>
          </div>
        </div>
        <div class="flex-1 space-y-3">
          <div class="flex items-center gap-x-2 text-xs">
            <p><span id="mins">00</span>:<span id="secs">00</span></p>
            <input id="range"
              type="range"
              min="0"
              max="100"
              step="1"
              class="range w-full accent-none appearance-none bg-slate-400 outline-none h-0.5 cursor-pointer"
            />
            <p><span id="duration-mins">90</span>:<span id="duration-secs">00</span></p>
            
          </div>
          <div class="flex justify-center items-center gap-x-10">
            <i
              data-lucide="fast-forward"
              class="rotate-180 size-4 fill-slate-700 stroke-none"
            ></i>
            <i
              data-lucide="fast-forward"
              class="rotate-180 size-5 fill-slate-700 stroke-none"
            ></i>
            <i
              data-lucide="circle"
              class="size-5 fill-slate-700 stroke-none"
            ></i>
            <i
              data-lucide="pause"
              class="size-5 fill-slate-700 stroke-none"
            ></i>
            <i
              data-lucide="fast-forward"
              class="size-5 fill-slate-700 stroke-none"
            ></i>
            <i
              data-lucide="fast-forward"
              class="size-4 fill-slate-700 stroke-none"
            ></i>
          </div>
        </div>
        <div class="flex gap-x-5">
          <div class="p-1 border-2 border-blue-300 rounded-full">
            <i data-lucide="circle" class="size-3 stroke-blue-300"></i>
          </div>

          <div>
            <i data-lucide="share-2" class="size-5 stroke-slate-700"></i>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
