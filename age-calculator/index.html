<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>age-calculator</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="font-garamond text-slate-950 text-lg">
    <section>
      <form
        action=""
        class="rounded-lg shadow-slate-300 shadow-2xl mx-auto my-32 w-5/6 max-w-xl flex flex-col gap-y-8 p-10"
      >
        <h1 class="text-center text-3xl font-bold">Age calculator</h1>
        <label for="" class="flex flex-col">
          <span>Enter your date of birth</span>
          <input id="date-of-birth" type="date" class="bg-slate-200 pl-4 py-2 pr-2 rounded-lg" />
        </label>
        <button
          id="calculate-btn"
          class="bg-slate-900 text-slate-100 py-4 font-bold rounded-lg"
        >
          Calculate Age
        </button>
        <p id="message" class="hidden">You are <span id="age" class=""></span> old</p>
      </form>
    </section>

    <script src="/src/main.js"></script>
  </body>
</html>
